<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Checker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">
            Student Grade Checker
        </h1>

        <label class="block text-gray-700 font-medium mb-2" for="name">Student Name</label>
        <input type="text" id="name" class="w-full border rounded-lg p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter your name">

        <label class="block text-gray-700 font-medium mb-2" for="score">Exam Score</label>
        <input type="number" id="score" min="0" max="100" class="w-full border rounded-lg p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter score (0-100)">

        <button onclick="checkGrade()" class="w-full bg-indigo-600 text-white font-medium p-3 rounded-lg hover:bg-indigo-700 transition duration-200">
            Check Grade
        </button>

        <div id="result" class="mt-6 text-center font-medium"></div>

    </div>

    <script>
        function checkGrade() {
            // Get input values
            let name = document.getElementById("name").value.trim();
            let score = document.getElementById("score").value;
            let resultDiv = document.getElementById("result");

            // Validasi sederhana
            if (name === "" || score === "") {
                resultDiv.innerHTML = `<span class="text-red-500">Please fill in all fields!</span>`;
                return;
            }

            // Tentukan grade berdasarkan score
            let grade = "";
            let color = "text-green-600";

            if (score >= 85) {
                grade = "A (Excellent)";
            } else if (score >= 70) {
                grade = "B (Good)";
            } else if (score >= 55) {
                grade = "C (Fair)";
            } else if (score >= 40) {
                grade = "D (Needs Improvement)";
            } else {
                grade = "E (Failed)";
                color = "text-red-600";
            }

            // Tampilkan hasil
            resultDiv.innerHTML = `Hello, <span class="font-bold">${name}</span>! Your grade is: <span class="${color} font-bold">${grade}</span>`;
        }
    </script>

</body>
</html>
